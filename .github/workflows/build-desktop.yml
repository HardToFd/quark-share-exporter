name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the build files
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist:${{ matrix.target }}
      - name: Upload packages to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes || \
            gh release view "$RELEASE_TAG" >/dev/null

          if [ "$BUILD_TARGET" = "mac" ]; then
            gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip --clobber
          else
            gh release upload "$RELEASE_TAG" release/*-Setup-*.exe release/*-Portable-*.exe --clobber
          fi
